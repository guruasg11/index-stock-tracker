name: Probe constituent URLs

# One-off discovery job. Finds the real constituent-CSV URL for every index
# with no stock list and writes data/constituent_url_overrides.json.
# Manual only - it never runs on a schedule.

on:
  workflow_dispatch:
    inputs:
      probe_limit:
        description: "Max URLs tried per index. 40 covers every naming form."
        required: false
        default: "40"
      probe_throttle:
        description: "Seconds between requests. Raise to 1.0 if NSE throttles."
        required: false
        default: "0.4"
      probe_only:
        description: "Comma-separated index names to probe. Blank = every index with no list."
        required: false
        default: ""
      probe_include_ok:
        description: "1 = also probe indices that already have a list."
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: probe-constituent-urls
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe constituent URLs
        env:
          TZ: Asia/Kolkata
          PROBE_LIMIT: ${{ github.event.inputs.probe_limit || '40' }}
          PROBE_THROTTLE: ${{ github.event.inputs.probe_throttle || '0.4' }}
          PROBE_ONLY: ${{ github.event.inputs.probe_only || '' }}
          PROBE_INCLUDE_OK: ${{ github.event.inputs.probe_include_ok || '0' }}
        run: python probe_constituents.py

      - name: Commit discovered URLs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/constituent_url_overrides.json data/constituent_probe_report.json
          if git diff --staged --quiet; then
            echo "No URLs discovered."
            exit 0
          fi
          git commit -m "chore(data): discovered constituent CSV URLs"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
