name: Update NSE data

on:
  schedule:
    # 14:00 UTC = 19:30 IST, Monday-Friday.
    # NSE closes 15:30 IST; EOD files are reliably published by ~19:00 IST.
    # GitHub's scheduler is best-effort and can lag 5-30 minutes under load.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      max_indices:
        description: "Number of indices to process. 0 = every index on NSE."
        required: false
        default: "0"
      skip_stocks:
        description: "Build indices only, no constituents. 1 = skip, 0 = include."
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-nse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build data files
        env:
          TZ: Asia/Kolkata
          MAX_INDICES: ${{ github.event.inputs.max_indices || '0' }}
          SKIP_STOCKS: ${{ github.event.inputs.skip_stocks || '0' }}
          NSE_THROTTLE: "0.35"
          NSE_ATTEMPTS: "3"
          HISTORY_DAYS: "400"
          CORP_ACTION_BAND: "0.25"
        run: python update_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): NSE refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-data
          path: data/
          if-no-files-found: warn
          retention-days: 7
